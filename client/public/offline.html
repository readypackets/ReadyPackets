<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — ReadyPackets</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #F5F7FA;
      color: #0E2A47;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(14,42,71,0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #E8F4F2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #6B7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #1A9E8A;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #158a78; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A9E8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6s4-2 11-2 11 2 11 2"/>
        <path d="M1 18s4 2 11 2 11-2 11-2"/>
        <line x1="1" y1="6" x2="1" y2="18"/>
        <line x1="23" y1="6" x2="23" y2="18"/>
        <line x1="12" y1="4" x2="12" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection. Some content may be available from cache,
      but you'll need to reconnect to access your portal.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
