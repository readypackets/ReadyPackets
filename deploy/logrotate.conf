# ReadyPackets Portal — log rotation
#
# The application itself logs to stdout, which journald captures and rotates
# according to journald.conf. These rules cover the nginx access and error logs
# for the site, which are the only files the deployment writes directly.
#
# Installed to /etc/logrotate.d/readypackets by deploy/install.sh.

/var/log/nginx/readypackets.access.log
/var/log/nginx/readypackets.error.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    # Access logs record IP addresses, which are personal data under GDPR; keep
    # them unreadable to other accounts and no longer than the retention period
    # stated in the privacy policy.
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 "$(cat /var/run/nginx.pid)"
        fi
    endscript
}
